schema_version = "1.0"

[behavior]
intended_behavior = "Require the canonical 218-clause coverage index and exhaustive PM-first audit contract while rejecting incomplete or altered skill packages."
proof = "tests/test_validate_repository.py covers the clean package, inventory hash/schema/binding/count/uniqueness, report contract, and prior package failure paths."

[characterization]
captured_behavior = "The v3 driver proves the established package behavior on both revisions and asserts the expanded inventory and PM-first contract when the complete expanded API is present."
proof = ".supportability-characterization.json maps both revisions to tests/characterization/exhaustive-pm-audit-contract-v3.characterization.py and its stable compatibility result; focused unit tests prove each expanded failure path."

[separation_of_concerns]
before = "The disposable canary retained complexity 14 as explicitly bounded legacy debt."
after = "The same canary reduces that legacy complexity to 12 without adding a new responsibility."
boundaries = [
    { path = "src/supportability_audit/s09_gate7_canary.py", kind = "function", symbol = "legacy_gap", before = "The function had complexity 14.", after = "The function has complexity 12." },
]

[architecture]
dependency_direction = "The regression suite invokes the repository validator; the validator uses only the Python standard library and repository files."
reviewed_paths = [
    "src/supportability_audit/__init__.py",
    "src/supportability_audit/s09_gate7_canary.py",
    "src/supportability_audit/validate_repository.py",
    "tests/test_validate_repository.py",
]

[responsibility_boundary]
path = "src/supportability_audit/s09_gate7_canary.py"
owns = "One disposable progressive-complexity qualification function and its stable canary constant."
does_not_own = "Audit execution, repository validation, production behavior, or Supportability Gate implementation."

[incremental_refactor]
target = "Reduce the isolated legacy qualification function toward the fixed complexity maximum."
completed_step = "Reduced the same function from complexity 14 to 12 in one bounded step."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Clause inventory, checklist, PM findings, and package-validation responsibilities are explicit."
cohesion = "References own immutable authority/index data; skill files own audit procedure/reporting; the existing source module owns deterministic package validation."
intended_behavior = "The audit remains read-only, vendor-neutral, advisory, and fail-closed when applicable proof is missing."
reviewability = "The change extends one existing validator, adds one canonical reference, and replaces one characterization scenario."

[[module_boundaries]]
path = "src/supportability_audit/__init__.py"
owner_path = "src/supportability_audit/validate_repository.py"
basis = "responsibility"
justification = "The package marker belongs to the repository-validation boundary owned by the validator module."

[[module_boundaries]]
path = "src/supportability_audit/validate_repository.py"
owner_path = "src/supportability_audit/validate_repository.py"
basis = "responsibility"
justification = "The validator module owns deterministic repository-package validation."

[[module_boundaries]]
path = "src/supportability_audit/s09_gate7_canary.py"
owner_path = "src/supportability_audit/s09_gate7_canary.py"
basis = "responsibility"
justification = "The disposable module owns one S09 Gate 7 canary constant."
