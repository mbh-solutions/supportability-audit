schema_version = "1.0"

[behavior]
intended_behavior = "Exercise one fresh disposable Python production-path canary through protected S11 integrated qualification without changing the Supportability Audit runtime behavior."
proof = "tests/test_validate_repository.py directly checks the canary constant, its cross-revision definition fallback, and the repository's exact package inventory."

[characterization]
captured_behavior = "The proven Python canary driver runs against both fresh S11 revisions, reads the head definition when the new module is absent from the base target, and imports the module from the head target."
proof = ".supportability-characterization.json binds tests/characterization/s09-gate7-quality.characterization.py to one stable golden result; tests/test_validate_repository.py proves the named definition assignment is selected."

[separation_of_concerns]
before = "The package had no disposable Python production-path canary for this qualification path."
after = "One isolated module owns the canary value, while the existing validator and tests retain package-validation and proof responsibilities."
boundaries = [
    { path = "src/supportability_audit/s09_gate7_canary.py", kind = "module", symbol = "src/supportability_audit/s09_gate7_canary.py", before = "No disposable Python quality canary existed.", after = "The disposable module owns one runtime constant exercised by one direct test." },
    { path = "src/supportability_audit/validate_repository.py", kind = "module", symbol = "src/supportability_audit/validate_repository.py", before = "The exact package inventory omitted the disposable canary files.", after = "The exact package inventory admits only the bounded canary files." },
]

[architecture]
dependency_direction = "The canary module has no dependencies; the direct test imports it, the cross-revision driver reads or imports it, and the validator admits only the exact canary files."
reviewed_paths = [
    "src/supportability_audit/__init__.py",
    "src/supportability_audit/s09_gate7_canary.py",
    "src/supportability_audit/validate_repository.py",
    "tests/test_validate_repository.py",
]

[responsibility_boundary]
path = "src/supportability_audit/validate_repository.py"
owns = "Deterministic validation of the Supportability Audit repository package."
does_not_own = "Audit execution, target remediation, generated-report certification, GitHub protection, or Supportability Gate implementation."

[incremental_refactor]
target = "Qualify one bounded disposable Python canary without changing the production main branch or the audit runtime contract."
completed_step = "Added one source constant, admitted only its exact files to the package inventory, and characterized the same value across base and head revisions."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "The historical S09 name identifies the reused proven fixture; this is a fresh S11 PR-scoped lifecycle."
cohesion = "The source module owns one canary value; the validator owns its exact package admission; the test and characterization files own direct and cross-revision proof."
intended_behavior = "The canary exists only to exercise protected qualification and does not alter Supportability Audit behavior."
reviewability = "The bounded change is one source constant plus its exact package admission, direct test, and cross-revision characterization."

[[module_boundaries]]
path = "src/supportability_audit/__init__.py"
owner_path = "src/supportability_audit/validate_repository.py"
basis = "responsibility"
justification = "The package marker belongs to the repository-validation boundary owned by the validator module."

[[module_boundaries]]
path = "src/supportability_audit/validate_repository.py"
owner_path = "src/supportability_audit/validate_repository.py"
basis = "responsibility"
justification = "The validator module owns deterministic repository-package validation."

[[module_boundaries]]
path = "src/supportability_audit/s09_gate7_canary.py"
owner_path = "src/supportability_audit/s09_gate7_canary.py"
basis = "responsibility"
justification = "The disposable module owns one reused canary constant for fresh S11 qualification."
