name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned Agent Skills reference validator
        run: >-
          python -m pip install --disable-pip-version-check
          "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

      - name: Validate Agent Skill
        run: skills-ref validate "$GITHUB_WORKSPACE"

      - name: Validate repository contract
        run: python src/supportability_audit/validate_repository.py

      - name: Test repository contract failures
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Compile validation source and tests
        run: python -m compileall -q src tests

      - name: Check whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          fi

      - name: Verify bundled Standard hash
        run: >-
          python -c "import hashlib, pathlib;
          expected='81653c5057c1555f8b6d41c6e5999d0b54caa178a2ca97a07216147ec16133e2';
          actual=hashlib.sha256(pathlib.Path('references/supportability-standard.md').read_bytes()).hexdigest();
          assert actual == expected, (expected, actual)"
